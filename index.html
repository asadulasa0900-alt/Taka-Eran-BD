<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাকা আর্ন বিডি - মূল অ্যাপ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0A0E1A; color: #E1E7EF; padding: 15px; max-width: 500px; margin: 0 auto; }
        .card { background-color: #121829; border: 1px solid #1E293B; border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .balance-box { text-align: center; background: linear-gradient(135deg, #10B981, #059669); color: #fff; padding: 20px; border-radius: 16px; margin-bottom: 15px; }
        .balance-box h2 { font-size: 28px; margin-top: 5px; }
        .title { font-size: 16px; font-weight: bold; color: #10B981; margin-bottom: 10px; }
        .task-card { background: #0A0E1A; border: 1px solid #334155; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-info h4 { font-size: 14px; color: #fff; }
        .task-info p { font-size: 12px; color: #94A3B8; }
        .btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background-color: #10B981; color: #fff; text-decoration: none; font-size: 12px; }
        input, select { width: 100%; padding: 10px; background-color: #0A0E1A; border: 1px solid #1E293B; border-radius: 8px; color: #ffffff; margin-bottom: 10px; font-size: 13px; outline: none; }
    </style>
</head>
<body>

    <!-- Balance Section -->
    <div class="balance-box">
        <p>আপনার বর্তমান ব্যালেন্স</p>
        <h2 id="userBalance">৳ 0.00</h2>
    </div>

    <!-- Live Tasks & Videos Section -->
    <div class="card">
        <div class="title">📋 এভেইলেবল টাস্ক, ভিডিও ও স্পন্সার পোস্ট</div>
        <div id="taskList">টাস্ক লোড হচ্ছে...</div>
    </div>

    <!-- Withdraw Section -->
    <div class="card">
        <div class="title">💳 টাকা উত্তোলন (Withdraw)</div>
        <select id="payMethod">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
            <option value="Recharge">মোবাইল রিচার্জ</option>
        </select>
        <input type="text" id="payAccount" placeholder="আপনার অ্যাকাউন্ট নম্বর দিন">
        <input type="number" id="payAmount" placeholder="টাকার পরিমাণ (সর্বনিম্ন ৫০ টাকা)">
        <button class="btn" style="width: 100%; padding: 12px;" onclick="requestWithdraw()">উইথড্র রিকোয়েস্ট পাঠান</button>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB9KjekXH9oD1JQLKU0HLQMnWMLDmzU4",
            authDomain: "taka-rane-bd.firebaseapp.com",
            databaseURL: "https://taka-rane-bd-default-rtdb.firebaseio.com",
            projectId: "taka-rane-bd",
            storageBucket: "taka-rane-bd.appspot.com",
            messagingSenderId: "1017127718075",
            appId: "1:1017127718075:web:f250801f23eb7c5ce06d9e"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Load Tasks and Videos from Firebase
        database.ref('customTasks').on('value', function(snapshot) {
            var data = snapshot.val();
            var list = document.getElementById('taskList');
            if(!data) {
                list.innerHTML = "<p style='color:#94A3B8; text-align:center;'>বর্তমানে কোনো টাস্ক বা ভিডিও নেই।</p>";
                return;
            }
            var html = "";
            for(var key in data) {
                var task = data[key];
                html += `<div class="task-card">
                    <div class="task-info">
                        <h4>[${task.type || 'Task'}] ${task.title}</h4>
                        <p>${task.subtitle} | <b style="color:#10B981;">৳${task.reward}</b></p>
                    </div>
                    <a href="${task.link}" target="_blank" class="btn" onclick="addReward(${task.reward})">শুরু করুন</a>
                </div>`;
            }
            list.innerHTML = html;
        });

        var currentBalance = 0;
        function addReward(amount) {
            currentBalance += amount;
            document.getElementById('userBalance').innerText = "৳ " + currentBalance.toFixed(2);
        }

        function requestWithdraw() {
            var method = document.getElementById('payMethod').value;
            var account = document.getElementById('payAccount').value.trim();
            var amount = parseFloat(document.getElementById('payAmount').value || 0);

            if(!account || amount < 50) {
                alert('সঠিক অ্যাকাউন্ট নম্বর দিন এবং সর্বনিম্ন ৫০ টাকা বা তার বেশি তুলুন!');
                return;
            }

            var reqData = {
                method: method,
                account: account,
                amount: amount,
                status: 'Pending',
                time: new Date().toLocaleString()
            };

            database.ref('withdrawRequests').push().set(reqData, function(error) {
                if(!error) {
                    alert('আপনার উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে!');
                    document.getElementById('payAccount').value = '';
                    document.getElementById('payAmount').value = '';
                } else {
                    alert('সমস্যা হয়েছে: ' + error.message);
                }
            });
        }
    </script>
</body>
</html>
