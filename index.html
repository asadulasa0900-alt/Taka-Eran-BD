<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাকা আনবিডি</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding-bottom: 130px; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { background: #28a745; color: white; padding: 12px; text-align: center; border-radius: 8px; margin-bottom: 12px; }
        .balance-card { background: #e9ecef; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 12px; font-weight: bold; font-size: 13px; display: flex; justify-content: space-around; }
        
        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 50px; left: 0; width: 100%; background: #ffffff; border-top: 2px solid #28a745; display: flex; justify-content: space-around; padding: 12px 0; z-index: 999999; box-shadow: 0 -4px 15px rgba(0,0,0,0.2); }
        .nav-item { border: none; background: none; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; color: #555; flex: 1; }
        .nav-item.active { color: #28a745; font-size: 13px; }
        .nav-item div { font-size: 20px; margin-bottom: 2px; }

        .card { border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; background: #fafafa; text-align: center; }
        .btn { display: inline-block; width: 100%; padding: 10px; background: #007bff; color: white; text-align: center; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-top: 5px; }
        .btn-success { background: #28a745; }
        .btn-warning { background: #ffc107; color: #000; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #28a745; margin: 0 auto 10px; display: block; background: #ddd; }
        
        /* Live Spinning Wheel */
        .wheel-container { position: relative; width: 160px; height: 160px; margin: 15px auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #28a745; background: conic-gradient(#ffc107 0deg 90deg, #28a745 90deg 180deg, #007bff 180deg 270deg, #dc3545 270deg 360deg); display: flex; align-items: center; justify-content: center; position: relative; transition: transform 3s cubic-bezier(0.15, 0.90, 0.15, 1); }
        .wheel-center { position: absolute; width: 35px; height: 35px; background: #fff; border-radius: 50%; border: 3px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 10px; }
        .wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid #333; z-index: 10; }

        /* 3D Press Effect for Tap-Tap Circle */
        .taptap-circle-3d { 
            width: 140px; height: 140px; 
            background: linear-gradient(145deg, #28a745, #1e7e34); 
            color: white; border-radius: 50%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 18px; font-weight: bold; margin: 20px auto; cursor: pointer; 
            box-shadow: 0 9px #1c6b2a, 0 15px 20px rgba(0,0,0,0.2); 
            user-select: none; transition: all 0.05s ease; 
        }
        .taptap-circle-3d:active { 
            transform: translateY(6px); 
            box-shadow: 0 3px #1c6b2a, 0 8px 10px rgba(0,0,0,0.2); 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3 style="font-size: 16px;">টাকা আনবিডি</h3>
        <p id="userNameText" style="font-size: 12px;">User</p>
    </div>

    <div class="balance-card">
        <div>টাকা: ৳<span id="userBalance">0.00</span></div>
        <div>এআর টোকেন: <span id="userToken">0</span></div>
        <div>স্পিন: <span id="spinLeft">3</span>টি</div>
    </div>

    <!-- Dynamic Content Area -->
    <div id="mainContent"></div>
</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
    <button class="nav-item active" id="nav1" onclick="loadPage(1)"><div>🏠</div>হোম</button>
    <button class="nav-item" id="nav2" onclick="loadPage(2)"><div>📋</div>টাস্ক</button>
    <button class="nav-item" id="nav3" onclick="loadPage(3)"><div>👤</div>প্রোফাইল</button>
    <button class="nav-item" id="nav4" onclick="loadPage(4)"><div>⚡</div>ট্যাপ</button>
    <button class="nav-item" id="nav5" onclick="loadPage(5)"><div>💸</div>উইথড্র</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB9kJeXXH9v0DlJYQLK6UH6_Vf_7W43Z3U", 
        authDomain: "taka-rane-bd.firebaseapp.com",
        databaseURL: "https://taka-rane-bd-default-rtdb.firebaseio.com",
        projectId: "taka-rane-bd",
        storageBucket: "taka-rane-bd.appspot.com",
        messagingSenderId: "1017127718075",
        appId: "1:1017127718075:web:f250801f23eb7c5ce06d9e"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let uid = localStorage.getItem('taka_uid');
    if (!uid) {
        uid = 'user_' + Math.random().toString(36).substring(2, 10);
        localStorage.setItem('taka_uid', uid);
    }

    let globalBalance = 0.00;
    let globalToken = 0;
    let globalSpins = 3;
    let ad1Count = 0;
    let ad2Count = 0;
    let totalAdsWatched = 0;
    let totalRefers = 0;
    let lastCheckInDate = "";
    let currentDegree = 0;

    document.getElementById('userNameText').innerText = "User_" + uid.substring(5, 10);

    const adLinks = [
        "https://asiafilm.org/4/6dc4413521dca73c0fa68d897c971b91",
        "https://auctionr.org/4/03e62852e0047e5b9397cdccfc07f679"
    ];
    function getRandomAd() { return adLinks[Math.floor(Math.random() * adLinks.length)]; }

    // অ্যাপসে ঢোকার সাথে সাথে অটোমেটিক অ্যাড শো করা এবং প্রতি ৫ মিনিট পর পর শো করার ফাংশন
    function initAutoAds() {
        // অ্যাপসে ঢোকার সাথে সাথে প্রথম অ্যাড
        setTimeout(() => {
            window.open(getRandomAd(), '_blank');
        }, 1500); // ১.৫ সেকেন্ড পর পপ-আপ হবে

        // প্রতি ৫ মিনিট (৩০০,০০০ মিলিভিসেকেন্ড) পর পর অটোমেটিক অ্যাড
        setInterval(() => {
            window.open(getRandomAd(), '_blank');
        }, 300000); 
    }

    // অ্যাপ লোড হওয়ার সাথে অটো অ্যাড ফাংশন কল করা হলো
    window.onload = function() {
        initAutoAds();
    };

    function loadPage(pageNo) {
        for(let i=1; i<=5; i++) {
            const navEl = document.getElementById('nav' + i);
            if(navEl) navEl.classList.remove('active');
        }
        document.getElementById('nav' + pageNo).classList.add('active');

        const contentDiv = document.getElementById('mainContent');

        if (pageNo === 1) {
            contentDiv.innerHTML = `
                <div class="card">
                    <h4>স্কয়ার অ্যাড রাউন্ড ১ (৳০.৪০)</h4>
                    <p>দেখা হয়েছে: <span id="ad1Show">${ad1Count}</span>/১০</p>
                    <button class="btn" onclick="watchHomeAd(1)">অ্যাড দেখুন (রাউন্ড ১)</button>
                </div>
                <div class="card">
                    <h4>স্কয়ার অ্যাড রাউন্ড ২ (৳০.৪০)</h4>
                    <p>দেখা হয়েছে: <span id="ad2Show">${ad2Count}</span>/১০</p>
                    <button class="btn btn-warning" onclick="watchHomeAd(2)">অ্যাড দেখুন (রাউন্ড ২)</button>
                </div>
                <div class="card">
                    <h4>🎁 ডেইলি চেকিং (৳১.০০)</h4>
                    <button class="btn btn-success" onclick="claimDailyCheckIn()">আজকের বোনাস নিন</button>
                </div>
                <div class="card">
                    <h4>⭐ স্পেশাল অ্যাড (৩টি অ্যাড দেখতে হবে)</h4>
                    <button class="btn btn-warning" onclick="watchSpecialAd()">স্পেশাল অ্যাড শুরু করুন</button>
                </div>
                <div class="card">
                    <h4>চাকা ঘোরান (Spin & Win - ৳০.৫০)</h4>
                    <p>স্পিন বাকি: <span id="spinCountText">${globalSpins}</span>টি</p>
                    <div class="wheel-container">
                        <div class="wheel-pointer"></div>
                        <div class="wheel" id="liveWheel"><div class="wheel-center">SPIN</div></div>
                    </div>
                    <button class="btn btn-success" id="spinBtn" onclick="spinWheel()">স্পিন করুন</button>
                </div>
            `;
        } else if (pageNo === 2) {
            contentDiv.innerHTML = `
                <h4 style="margin-bottom: 10px; text-align: center;">সোশ্যাল মিডিয়া টাস্কসমূহ</h4>
                <div class="card" style="text-align: left;">
                    <h4 style="color: #28a745; font-size: 14px;">📺 ইউটিউব / ফেসবুক টাস্ক (৳২.০০)</h4>
                    <input type="file" id="taskFile" accept="image/*">
                    <button class="btn btn-warning" onclick="submitTask()">টাস্ক জমা দিন</button>
                </div>
            `;
        } else if (pageNo === 3) {
            contentDiv.innerHTML = `
                <div class="card">
                    <h4>ইউজার প্রোফাইল ও রেফার</h4>
                    <img src="https://via.placeholder.com/80" class="profile-img">
                    <p style="font-size: 13px
