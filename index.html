<!-- Custom Proof Upload Modal -->
<div id="proofModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#121829; padding:20px; border-radius:16px; width:90%; max-width:400px; border:1px solid #1E293B; text-align:center;">
        <h3 style="color:#10B981; margin-bottom:10px; font-size:16px;">📸 কাজের প্রুফ বা স্ক্রিনশট জমা দিন</h3>
        <p style="font-size:12px; color:#94A3B8; margin-bottom:15px;">ফাইল ম্যানেজার থেকে স্ক্রিনশটের ছবি সিলেক্ট করুন অথবা কাজের বিবরণ লিখুন।</p>
        
        <input type="text" id="proofText" placeholder="আপনার ইউটিউব/ফেসবুক নাম বা প্রুফ নোট" style="margin-bottom: 10px;">
        
        <label style="font-size: 12px; color: #10B981; display: block; margin-bottom: 5px; text-align:left;">অথবা ফাইল ম্যানেজার থেকে স্ক্রিনশট ছবি দিন:</label>
        <input type="file" id="proofFile" accept="image/*" style="padding: 8px; background: #0A0E1A; margin-bottom: 15px;">
        
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="background-color: #EF4444; flex:1;" onclick="closeProofModal()">বাতিল</button>
            <button class="btn" style="flex:1;" onclick="confirmSubmitProof()">জমা দিন</button>
        </div>
    </div>
</div>
