<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাকা আর্ন বিডি - এডমিন কন্ট্রোল প্যানেল</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0A0E1A; color: #E1E7EF; padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background-color: #121829; border: 1px solid #10B981; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .title { font-size: 18px; font-weight: bold; color: #10B981; margin-bottom: 15px; text-align: center; }
        input { width: 100%; padding: 12px; background-color: #0A0E1A; border: 1px solid #1E293B; border-radius: 10px; color: #ffffff; margin-top: 6px; margin-bottom: 12px; font-size: 14px; outline: none; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background-color: #10B981; color: #fff; text-align: center; text-decoration: none; display: block; margin-top: 10px; }
        .btn-purple { background-color: #8B5CF6; }
        .btn-red { background-color: #EF4444; }
        .btn-green { background-color: #10B981; }
        .sec-title { font-weight: bold; color: #3B82F6; margin: 15px 0 10px 0; border-top: 1px dashed #334155; padding-top: 10px; }
        .req-card { background: #0A0E1A; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .btn-group { display: flex; gap: 10px; margin-top: 8px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Admin Login Screen -->
    <div id="loginSection" class="card">
        <div class="title">🔒 এডমিন লগইন</div>
        <input type="password" id="adminPass" placeholder="এডমিন পাসওয়ার্ড দিন (Asadul123@AR)">
        <button class="btn" onclick="loginAdmin()">লগইন করুন</button>
    </div>

    <!-- Admin Main Dashboard -->
    <div id="dashboardSection" style="display: none;">
        <div class="card">
            <div class="title">👑 টাকা আর্ন বিডি - এডমিন প্যানেল</div>
            <button class="btn btn-red" style="margin-bottom: 15px;" onclick="logoutAdmin()">লগআউট করুন</button>

            <!-- 1. Add New Task -->
            <div class="sec-title">➕ নতুন টাস্ক যোগ করুন (ইউটিউব/টিকটক/অ্যাপস)</div>
            <input type="text" id="taskTitle" placeholder="টাস্ক টাইটেল (যেমন: YouTube Subscribe)">
            <input type="text" id="taskSub" placeholder="বিবরণ (যেমন: চ্যানেল সাবস্ক্রাইব করুন)">
            <input type="text" id="taskLink" placeholder="কাজের লিংক (https://...)">
            <input type="number" id="taskReward" placeholder="টাকার পরিমাণ (যেমন: 10)">
            <button class="btn btn-purple" onclick="addNewTask()">টাস্ক প্যানেলে যুক্ত করুন</button>

            <!-- 2. Manage Withdraw Requests -->
            <div class="sec-title">💳 পেন্ডিং উইথড্র রিকোয়েস্টসমূহ</div>
            <div id="withdrawList">ডাটা লোড হচ্ছে...</div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // আপনার ফায়ারবেজ কনসোল থেকে আসল কনফিগারেশন এখানে বসান
        const firebaseConfig = {
            apiKey: "আপনার_আসল_apiKey_এখানে_দিন",
            authDomain: "taka-earn-bd-default-rtdb.firebaseapp.com",
            databaseURL: "https://taka-earn-bd-default-rtdb.firebaseio.com",
            projectId: "taka-earn-bd",
            storageBucket: "taka-earn-bd.appspot.com",
            messagingSenderId: "আপনার_আসল_SenderId",
            appId: "আপনার_আসল_AppId"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function loginAdmin() {
            var pass = document.getElementById('adminPass').value;
            if (pass === 'Asadul123@AR') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadAdminData();
            } else {
                alert('ভুল পাসওয়ার্ড!');
            }
        }

        function logoutAdmin() {
            document.getElementById('adminPass').value = '';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';
        }

        function addNewTask() {
            var title = document.getElementById('taskTitle').value.trim();
            var sub = document.getElementById('taskSub').value.trim();
            var link = document.getElementById('taskLink').value.trim();
            var reward = parseFloat(document.getElementById('taskReward').value || '0');

            if (!title || !link || reward <= 0) {
                alert('অনুগ্রহ করে সঠিক বিবরণ ও লিংক দিন!');
                return;
            }

            var newTaskRef = database.ref('customTasks').push();
            newTaskRef.set({
                title: title,
                subtitle: sub || 'টাস্কটি সম্পন্ন করে আয় করুন',
                link: link,
                reward: reward
            }, function(err) {
                if(!err) {
                    alert('নতুন টাস্ক সফলভাবে লাইভ যোগ করা হয়েছে!');
                    document.getElementById('taskTitle').value = '';
                    document.getElementById('taskSub').value = '';
                    document.getElementById('taskLink').value = '';
                    document.getElementById('taskReward').value = '';
                } else {
                    alert('ত্রুটি: ' + err.message);
                }
            });
        }

        function loadAdminData() {
            var display = document.getElementById('withdrawList');
            database.ref('withdrawRequests').on('value', function(snapshot) {
                var data = snapshot.val();
                if (!data) {
                    display.innerHTML = "<div style='color:#94A3B8; text-align:center;'>কোনো উইথড্র রিকোয়েস্ট নেই।</div>";
                    return;
                }
                var html = "";
                for (var key in data) {
                    var req = data[key];
                    html += `<div class="req-card">
                        <b>মেথড:</b> ${req.method || 'N/A'} | <b>নম্বর:</b> ${req.account || 'N/A'}<br>
                        <b>টাকা:</b> ৳${req.amount || 0} | <b>সময়:</b> ${req.time || 'N/A'}<br>
                        <b>স্ট্যাটাস:</b> <span style="color:${req.status === 'Approved' ? '#10B981' : (req.status === 'Rejected' ? '#EF4444' : '#F59E0B')}">${req.status || 'Pending'}</span>
                        <div class="btn-group">
                            <button class="btn-sm btn-green" onclick="updateReqStatus('${key}', 'Approved')">Approve</button>
                            <button class="btn-sm btn-red" onclick="updateReqStatus('${key}', 'Rejected')">Reject</button>
                        </div>
                    </div>`;
                }
                display.innerHTML = html;
            });
        }

        function updateReqStatus(key, newStatus) {
            database.ref('withdrawRequests/' + key).update({
                status: newStatus
            }).then(function() {
                alert('উইথড্র রিকোয়েস্ট স্ট্যাটাস আপডেট করা হয়েছে: ' + newStatus);
            }).catch(function(error) {
                alert('স্ট্যাটাস আপডেট করতে সমস্যা হয়েছে: ' + error.message);
            });
        }
    </script>
</body>
</html>
